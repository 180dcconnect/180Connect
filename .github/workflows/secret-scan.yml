name: Secret scan

# Fails a pull request if a credential is committed. See docs/secrets.md.
#
# Runs on pull requests rather than pushes because push protection — which
# blocks the credential before it reaches GitHub at all — needs GitHub Secret
# Protection, which is a paid add-on on private repositories.
#
# gitleaks-action is free on personal accounts and public repos. If this
# repository ever moves to a GitHub organisation it will demand a
# GITLEAKS_LICENSE — see docs/secrets.md for what to do instead.

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans commit history, not just the working tree, so it
          # needs the full clone. The default shallow checkout hides older
          # commits on the branch.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

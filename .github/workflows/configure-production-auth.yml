name: Configure production Auth email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Configure Supabase Auth SMTP
    runs-on: ubuntu-latest
    steps:
      - name: Configure and verify custom SMTP
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_SMTP_API_KEY: ${{ secrets.RESEND_SMTP_API_KEY }}
          PROD_REF: ${{ vars.SUPABASE_PROD_REF }}
        run: |
          set -euo pipefail

          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$RESEND_SMTP_API_KEY"
          test -n "$PROD_REF"

          response="$(
            jq -n \
              --arg password "$RESEND_SMTP_API_KEY" \
              '{
                external_email_enabled: true,
                mailer_autoconfirm: false,
                mailer_secure_email_change_enabled: true,
                smtp_admin_email: "180connect@steeze.ng",
                smtp_host: "smtp.resend.com",
                smtp_port: "587",
                smtp_user: "resend",
                smtp_pass: $password,
                smtp_sender_name: "180 Connect"
              }' |
              curl --fail-with-body --silent --show-error \
                --request PATCH \
                --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                --header "Content-Type: application/json" \
                --data-binary @- \
                "https://api.supabase.com/v1/projects/$PROD_REF/config/auth"
          )"

          jq -e '
            .external_email_enabled == true and
            .mailer_autoconfirm == false and
            .mailer_secure_email_change_enabled == true and
            .smtp_admin_email == "180connect@steeze.ng" and
            .smtp_host == "smtp.resend.com" and
            .smtp_port == "587" and
            .smtp_user == "resend" and
            .smtp_sender_name == "180 Connect"
          ' <<<"$response" >/dev/null

          echo "Production Supabase Auth SMTP is configured and verified."

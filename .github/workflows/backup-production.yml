# Nightly backup of the production database to Vercel Blob storage.
# Story: F225 (#220) — Database Backups. See docs/Backups/F225-database-backups.md.
#
# Four separate dumps (roles, schema, auth data, public data) because a single
# dump command captures none of them completely — see section 2 of
# docs/Backups/F225-database-backups.md. Restore order is roles -> schema ->
# authdata -> data, and it is not optional: public.users has a foreign key to
# auth.users, so the auth rows must exist first.
#
# Uses pg_dump/pg_dumpall directly rather than `supabase db dump`, because the
# Supabase CLI's dump command shells out to Docker even for a remote database.
name: Backup production database

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  # Manual re-run button in the Actions tab, for testing without waiting for 3am.
  workflow_dispatch:

# Never let two backup runs race against the same database.
concurrency:
  group: supabase-backup-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Neither of these is a secret: the project ref is public in the project URL,
  # and the pooler host is the shared Supavisor endpoint for the region. Same
  # pattern as STAGING_REF in migrations.yml.
  PROD_REF: ${{ vars.SUPABASE_PROD_REF }}
  # The direct connection (db.<ref>.supabase.co) is IPv6-only unless the paid
  # IPv4 add-on is enabled, and GitHub-hosted runners have no IPv6 — so this
  # must be the *session mode* pooler host (port 5432, not 6543; transaction
  # mode does not support pg_dump).
  PGHOST: ${{ vars.SUPABASE_PROD_POOLER_HOST }}
  PGPORT: '5432'
  PGDATABASE: postgres
  # Retention: delete dumps older than 30 days (R8).
  RETENTION_DAYS: '30'
  # How far back the prune step sweeps. Anything older than this is only
  # reachable by hand — see the prune step's comment.
  PRUNE_WINDOW_DAYS: '180'

jobs:
  backup:
    name: dump 180connect-production -> Vercel Blob
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships the PostgreSQL 16 client, and production runs
      # PostgreSQL 17. pg_dump refuses to dump a server newer than itself
      # ("aborting because of server version mismatch"), so install the
      # matching major version from the PostgreSQL APT repository.
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      # Pinned: an unpinned `npm install -g vercel` means every nightly run
      # picks up whatever was published that day, including breaking flag
      # changes to `vercel blob`.
      - name: Install Vercel CLI
        run: npm install -g vercel@57

      # If the production project has auto-paused from inactivity (free plan),
      # this is the step that fails. A failed step fails the job, which GitHub
      # emails to everyone watching the repo by default — that email IS the
      # "fail visibly" requirement. Do not wrap this in `|| true` or similar;
      # a swallowed failure here is a backup that silently never happened.
      #
      # --no-owner/--no-privileges: the `postgres` role on Supabase is not a
      # superuser, so a restore cannot reassign ownership to supabase_admin.
      # Dumping those statements guarantees a noisy, half-failed restore.
      #
      # --schema=public --schema=app: the two schemas this project owns. `app`
      # holds the RLS helper functions (app.is_admin, app.can_write, …) that
      # every policy in `public` calls, so a public-only dump restores tables
      # whose policies reference functions that do not exist. Supabase's own
      # schemas (auth, storage, realtime, extensions, vault, graphql) stay out —
      # they already exist in whatever project we restore into.
      #
      # --no-role-passwords: every role in this cluster is Supabase-managed and
      # cannot be restored into a Supabase target at all (they are reserved
      # roles). The file is kept because a plain-Postgres target still needs
      # `anon`/`authenticated` to exist for the RLS policies to apply — but
      # shipping SCRAM password hashes for roles nobody can restore is
      # credential material in the blob store buying nothing.
      #
      # auth and public data are dumped SEPARATELY, and auth excludes
      # schema_migrations. Reason, found during the R4 restore test: postgres
      # cannot write auth.schema_migrations (it belongs to supabase_auth_admin),
      # and pg_dump orders auth before public, so one permission error on a
      # Supabase-internal bookkeeping table aborted the restore before a single
      # row of application data loaded. Separate files mean an auth problem can
      # never again block the data we actually care about.
      - name: Dump roles, schema, and data
        id: dump
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          mkdir -p dumps

          pg_dumpall --roles-only --no-role-passwords -f "dumps/roles_$DATE.sql"

          pg_dump --schema-only --no-owner --no-privileges \
            --schema=public --schema=app -f "dumps/schema_$DATE.sql"

          pg_dump --data-only --no-owner --no-privileges \
            --schema=auth --exclude-table=auth.schema_migrations \
            -f "dumps/authdata_$DATE.sql"

          pg_dump --data-only --no-owner --no-privileges \
            --schema=public -f "dumps/data_$DATE.sql"

          # A dump that "succeeded" but produced an empty file is worse than a
          # failure, because it looks like a backup. pg_dump writes a header
          # even for an empty database, so anything under 1KB is broken.
          for f in dumps/*.sql; do
            size=$(wc -c < "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 1024 ]; then
              echo "::error::$f is only $size bytes — refusing to upload a truncated backup"
              exit 1
            fi
          done
        env:
          # Passed out of band rather than interpolated into a connection URL:
          # a password containing @ / # ? or : silently corrupts a URL, and the
          # failure then looks like a wrong host rather than a quoting bug.
          PGUSER: postgres.${{ vars.SUPABASE_PROD_REF }}
          PGPASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}

      # --allow-overwrite: without it, a second run on the same date (a manual
      # re-run after a failure, most likely) fails on an already-existing path.
      #
      # Credentials come from the environment rather than --rw-token. Both are
      # supported, but the environment form is what Vercel documents, and it
      # keeps the token out of the process's argument list.
      #
      # VERCEL_TOKEN is optional and only set when the secret exists. The first
      # CI run of this workflow failed here with "No existing credentials found.
      # Please run `vercel login` or pass --token", which is the CLI's
      # account-auth error rather than its Blob-credential one. That error could
      # not be reproduced locally: with an empty HOME, no config and no account
      # token, `vercel blob put --rw-token` reaches the Blob API in every case
      # tried (valid-format, malformed, whitespace-padded and empty tokens each
      # produce a *Blob* error, never this one). Vercel's own docs show the RW
      # token used alone, including for raw curl against private blobs. So the
      # account token is carried as a fallback rather than a diagnosis — if the
      # secret is absent the step behaves exactly as before.
      - name: Upload dumps to Vercel Blob
        run: |
          set -euo pipefail
          DATE="${{ steps.dump.outputs.date }}"

          # Fail with a useful message rather than the CLI's, which does not
          # distinguish "no token" from "wrong token". Only the length and the
          # prefix match are reported — never any part of the value.
          if [ -z "${BLOB_READ_WRITE_TOKEN:-}" ]; then
            echo "::error::BLOB_READ_WRITE_TOKEN is empty. Check the repository secret exists and has a value."
            exit 1
          fi
          echo "Blob token: ${#BLOB_READ_WRITE_TOKEN} chars"
          case "$BLOB_READ_WRITE_TOKEN" in
            vercel_blob_rw_*) echo "Blob token: prefix looks correct" ;;
            *) echo "::error::BLOB_READ_WRITE_TOKEN does not start with 'vercel_blob_rw_'. It is probably not a Blob read-write token — re-copy it from Vercel → Storage → the store → Tokens." ; exit 1 ;;
          esac

          # An empty VERCEL_TOKEN would be treated as a supplied-but-invalid
          # token, so remove it entirely when the secret is not set.
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            unset VERCEL_TOKEN
            echo "No VERCEL_TOKEN set; relying on the Blob read-write token alone."
          else
            echo "VERCEL_TOKEN is set; the CLI will use it for account auth."
          fi

          for f in dumps/*.sql; do
            name=$(basename "$f")
            vercel blob put "$f" \
              --access private \
              --allow-overwrite true \
              --pathname "backups/$DATE/$name"
          done
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Vercel Blob has no built-in lifecycle/auto-expiry (unlike R2 or S3), so
      # retention (R8) is this script, not a platform setting.
      #
      # Filenames are deterministic (backups/<date>/<name>_<date>.sql), so the
      # paths to delete can be computed rather than listed and parsed. This
      # sweeps every date from RETENTION_DAYS to PRUNE_WINDOW_DAYS ago, not just
      # the single day that fell out of retention: if the job is down for a
      # week, a single-day prune leaves those seven days behind permanently,
      # and personal data outliving its documented retention period is exactly
      # what R8 exists to prevent. Deletes are batched into one call because
      # Vercel Blob's delete is idempotent — unknown paths are a no-op.
      #
      # Bound worth knowing: if this workflow is dead for longer than
      # PRUNE_WINDOW_DAYS, dumps older than that window need pruning by hand.
      - name: Delete backups older than 30 days
        run: |
          set -euo pipefail
          paths=()
          for (( d=RETENTION_DAYS+1; d<=PRUNE_WINDOW_DAYS; d++ )); do
            PRUNE_DATE=$(date -u -d "$d days ago" +%Y%m%d)
            for name in roles schema authdata data; do
              paths+=("backups/$PRUNE_DATE/${name}_$PRUNE_DATE.sql")
            done
          done
          echo "Pruning ${#paths[@]} candidate paths (${RETENTION_DAYS}-${PRUNE_WINDOW_DAYS} days old)"
          # Same credential handling as the upload step above.
          if [ -z "${VERCEL_TOKEN:-}" ]; then unset VERCEL_TOKEN; fi
          vercel blob del "${paths[@]}"
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

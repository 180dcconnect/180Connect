# Verifies and applies database migrations.
# Stories: F232 (#227) — Database Migration Management, F224 (#224) — Row-Level Security.
# See supabase/MIGRATIONS.md and docs/rls-permission-matrix.md.
#
# Staging auto-applies on push to dev; production auto-applies on push to main.
# The human gate is the merge itself — dev->main is already a PM decision (SOP
# §7, docs/production-deployment.md), so a second manual `db push` afterward
# added a step without adding a review. Changed 5 Aug 2026 (Bashir): prod used
# to require a manual push, which is exactly how prod drifted behind staging
# (3 migrations silently skipped — see git history around 2026-08-05).
name: Database migrations

on:
  push:
    branches: [dev, main]
    paths:
      - 'supabase/**'
      - 'scripts/verify-rls-coverage.sql'
      - 'scripts/verify-anon-lockout.sh'
      - 'scripts/verify-last-admin-guard.mts'
      - '.github/workflows/migrations.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/verify-rls-coverage.sql'
      - 'scripts/verify-anon-lockout.sh'
      - 'scripts/verify-last-admin-guard.mts'
      - '.github/workflows/migrations.yml'
  # Manual re-run, e.g. after fixing a failed apply.
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  # Not secrets: a project ref is public in the project URL. Held as repo
  # variables so environment refs are never hardcoded in the workflow.
  STAGING_REF: ${{ vars.SUPABASE_STAGING_REF }}
  PROD_REF: ${{ vars.SUPABASE_PROD_REF }}
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  # One place to bump the CLI, read by both jobs. See the note at its first use.
  SUPABASE_CLI_VERSION: 2.110.0

jobs:
  # Runs on every PR, before anything touches staging. The local stack replays all
  # migrations from an empty database, so this also proves the migration sequence
  # still applies cleanly from scratch — not only that today's diff applies on top
  # of whatever staging happens to contain.
  verify:
    name: Verify migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap and first: a stale migration timestamp is a hard `db push` failure on
      # dev, and the apply job that would reveal it does not run on pull requests.
      # No credentials and no network beyond a shallow fetch of the base branch, so
      # it costs seconds and cannot be the flaky step. See the script's header.
      - name: Migration timestamps are ahead of the base branch
        if: github.event_name == 'pull_request'
        # Via env, not interpolated into the command: a ref name is attacker-shaped
        # input, and `${{ }}` is substituted before the shell ever sees it.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: scripts/verify-migration-order.sh "$BASE_REF"

      # Needed only for the last-admin concurrency guard step below, which is a
      # node/pg script rather than SQL or a shell probe like this job's other
      # checks. Every other step here works without it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. Resolving `latest` costs an unauthenticated
          # call to the GitHub releases API, which is rate-limited per runner IP
          # and shared across every project on that host — so it fails at random,
          # with nothing wrong in the PR. It took down a green run on 29 Jul 2026
          # ("Failed to resolve latest Supabase CLI release: rate limit exceeded")
          # six seconds in. A pin also means the CLI cannot change under us
          # between two runs of the same commit.
          # Bump deliberately: https://github.com/supabase/cli/releases
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Studio, realtime, storage and the rest are not exercised by these tests and
      # cost roughly a minute of startup each.
      - name: Start local stack (db + auth)
        run: |
          supabase start \
            -x studio,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit

      - name: Show applied migrations
        run: supabase migration list --local

      # pgTAP behaviour tests: policies enforce the permission matrix for real
      # admin and CAM identities. Tests for tables that have not been migrated yet
      # report as skipped.
      - name: RLS behaviour tests
        run: supabase test db

      # Matrix §6 gap 7: proves set_user_role, set_user_active and deactivate_user
      # actually serialize against each other under real concurrency, which pgTAP's
      # single-session suite structurally cannot exercise (see the script's header).
      - name: Last-admin concurrency guard
        run: npm run verify:last-admin
        env:
          SUPABASE_DB_URL: ${{ env.LOCAL_DB_URL }}

      # Sequence step 15: no table ships without RLS and policies.
      - name: RLS coverage gate
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/verify-rls-coverage.sql

      # The application-bypass check: hit PostgREST directly with the public anon
      # key and confirm it reaches nothing.
      - name: Anonymous lockout probe
        run: |
          ANON_KEY="$(supabase status -o json | jq -r '.ANON_KEY')"
          scripts/verify-anon-lockout.sh "http://127.0.0.1:54321" "$ANON_KEY"

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

  apply-staging:
    name: db push -> 180connect-staging
    runs-on: ubuntu-latest
    # Staging is only ever written from dev, and only after verify passes. A PR
    # that fails the RLS gate cannot reach the shared database.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: verify
    # Never let two staging applies race each other.
    concurrency:
      group: supabase-migrations-staging
      cancel-in-progress: false
    # No `environment:` set — the repo has no "staging" environment and it could not
    # be created via the API. Add one in Settings > Environments if you later want
    # env-scoped secrets or a required-reviewer gate on staging applies.
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Same pin as the verify job, and the same reason. It matters more
          # here: this job writes to the shared staging database, so the tool
          # doing the writing should not change without someone choosing it.
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link staging and show pending migrations
        run: |
          supabase link --project-ref "$STAGING_REF"
          supabase migration list

      - name: Apply migrations
        run: supabase db push

      - name: Confirm local and remote are in sync
        run: supabase migration list

      # Same probe against the real staging API. The local run proves the policies
      # are correct; this proves they actually reached staging.
      - name: Anonymous lockout probe (staging)
        if: vars.SUPABASE_STAGING_URL != '' && vars.SUPABASE_STAGING_ANON_KEY != ''
        run: |
          scripts/verify-anon-lockout.sh \
            "${{ vars.SUPABASE_STAGING_URL }}" \
            "${{ vars.SUPABASE_STAGING_ANON_KEY }}"

  apply-prod:
    name: db push -> 180connect-production
    runs-on: ubuntu-latest
    # Production is only ever written from main, and only after verify passes.
    # The human gate is the dev->main merge itself (PM decision, SOP §7) — this
    # job is what used to be a manual `supabase db push` run by hand after that
    # merge. Mirrors apply-staging exactly; see that job for the per-step reasoning.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    # Never let two prod applies race each other. Separate group from staging:
    # the two databases are independent, a staging apply must not block prod.
    concurrency:
      group: supabase-migrations-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link production and show pending migrations
        run: |
          supabase link --project-ref "$PROD_REF"
          supabase migration list

      - name: Apply migrations
        run: supabase db push

      - name: Confirm local and remote are in sync
        run: supabase migration list

      # Same probe against the real production API. The local run proves the
      # policies are correct; this proves they actually reached production.
      - name: Anonymous lockout probe (production)
        if: vars.SUPABASE_PROD_URL != '' && vars.SUPABASE_PROD_ANON_KEY != ''
        run: |
          scripts/verify-anon-lockout.sh \
            "${{ vars.SUPABASE_PROD_URL }}" \
            "${{ vars.SUPABASE_PROD_ANON_KEY }}"
